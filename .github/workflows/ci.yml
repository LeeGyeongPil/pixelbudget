# Fully offline: no API keys, no network access needed by the tests.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
      - run: uv run --python ${{ matrix.python }} python examples/quickstart.py
      - run: uv build
